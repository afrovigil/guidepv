name: Sync Subfolder to Package Branch

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/bj/**' # Only run when this folder changes

jobs:
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for filtering

      - name: Push Subfolder to Branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: package-pvbj  # Target branch
          FOLDER: packages/bj # Subfolder path
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
